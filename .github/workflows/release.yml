name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip=PaddingTool$($version.Replace('.', '_')).zip" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish PaddingTool/PaddingTool.csproj -c Release -o publish -p:Version=${{ steps.ver.outputs.version }}

      - name: Package
        shell: pwsh
        run: |
          Copy-Item -Recurse Licenses publish/Licenses
          Compress-Archive -Path publish/* -DestinationPath "${{ steps.ver.outputs.zip }}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "${{ steps.ver.outputs.zip }}" --title "${{ github.ref_name }}" --generate-notes
